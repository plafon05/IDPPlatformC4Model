name: PlantUML CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagrams:
    name: Render PlantUML diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          curl --fail --location --retry 3 \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar \
            --output "$RUNNER_TEMP/plantuml.jar"

      - name: Render SVG and PNG diagrams
        env:
          PLANTUML_JAR: ${{ runner.temp }}/plantuml.jar
        run: |
          python3 scripts/render_diagrams.py

      - name: Upload diagrams
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-diagrams
          path: |
            diagrams/**/*.svg
            diagrams/**/*.png
          if-no-files-found: error

      - name: Commit updated diagrams
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -A -- diagrams
          if git diff --cached --quiet; then
            echo 'Diagrams are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Обновлены сгенерированные диаграммы"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
